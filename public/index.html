<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Rotación de técnicos — Acceso</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="bg" class="bg-rays" aria-hidden="true"></div>
    <main class="wrap wrap-auth">
      <section class="auth-card" aria-labelledby="auth-titulo">
        <h1 id="auth-titulo">Rotación de técnicos</h1>
        <p class="auth-sub">Elige tu sede e introduce la contraseña para entrar.</p>

        <form id="auth-form" novalidate>
          <label class="auth-field">
            <span>Sede</span>
            <select id="site-select" required></select>
          </label>

          <label class="auth-field">
            <span>Contraseña</span>
            <input id="password" type="password" autocomplete="current-password" required />
          </label>

          <p id="auth-error" class="auth-error" role="status" aria-live="polite" hidden></p>

          <button id="submit-btn" type="submit" class="btn btn-primary auth-submit">Entrar</button>
        </form>

        <p id="auth-loading" class="auth-sub">Cargando sedes…</p>

        <a href="/admin.html" class="auth-admin-link">¿Eres administrador? Entrar al panel</a>
      </section>
    </main>

    <script type="module" src="/bridge.js"></script>
  </body>
</html>
